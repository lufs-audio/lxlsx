[package]
name = "lxlsx"
version = "0.1.0"
edition = "2021"
authors = ["Daniel Ramirez <daniel@lufs.audio>"]
description = "A contract-verified, agent-first process registry for Excel workbooks (lufs.)"
license = "GPL-3.0"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
rust_xlsxwriter = "0.79"
calamine = "0.26"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
